# rust/Cargo.toml
[package]
name = "jpcl"
version = "2.0.0"
edition = "2024"
rust-version = "1.85"
description = "A hybrid JSON/TOML configuration language (.jp files)"
license = "MIT"
repository = "https://github.com/jpcl-lang/jpcl"
homepage = "https://jpcl.has-a.wiki"
readme = "../README.md"
keywords = [
    "config",
    "configuration",
    "parser",
    "toml",
    "json",
]
categories = [
    "config",
    "parser-implementations",
    "command-line-utilities",
]
include = [
    "src/**",
    "LICENSE",
    "Cargo.toml",
]

[[bin]]
name = "jpcl"
path = "src/main.rs"

[dependencies]
