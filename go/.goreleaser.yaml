version: 2

project_name: jpml

before:
  hooks:
    - go mod tidy

builds:
  - id: jpml
    main: ./cmd/jpml
    binary: jpml
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/jpml-lang/jpml-go.Version={{ .Version }}

archives:
  - id: jpml
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - LICENSE
      - README.md

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^test:"
      - "^ci:"
      - "^chore:"

release:
  github:
    owner: jpml-lang
    name: jpml-go
