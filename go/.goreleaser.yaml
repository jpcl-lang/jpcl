version: 2

project_name: jpcl

before:
  hooks:
    - go mod tidy

builds:
  - id: jpcl
    main: ./cmd/jpcl
    binary: jpcl
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/jpcl-lang/jpcl/go.Version={{ .Version }}

archives:
  - id: jpcl
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - LICENSE
      - src: ../README.md
        strip_parent: true

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^test:"
      - "^ci:"
      - "^chore:"

release:
  github:
    owner: jpcl-lang
    name: jpcl
