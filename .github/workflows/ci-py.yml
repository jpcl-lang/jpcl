# .github/workflows/ci-py.yml
name: CI (py)

on:
  push:
    branches: [main, master]
    paths:
      - "py/**"
      - ".github/workflows/ci-py.yml"
  pull_request:
    paths:
      - "py/**"
      - ".github/workflows/ci-py.yml"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-py-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: py

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v7

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.14"
          enable-cache: true
          working-directory: py

      - name: Install the project
        run: uv sync --locked

      - name: Run tests
        run: uv run pytest -q

      # Note: 'jpcl fmt' is deliberately not enforced here -- rewriting a file
      # drops its comments, so formatting stays a manual choice.
      - name: Validate the bundled .jp files
        shell: bash
        run: uv run jpcl check data/*.jp
