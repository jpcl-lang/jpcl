# .github/workflows/publish-py.yml
name: Publish (py)

# Publishes to PyPI with Trusted Publishing (OIDC) -- there are no API tokens
# or repository secrets to manage.  See "Releasing" in py/CONTRIBUTING.md for
# the one-time PyPI setup this expects.
#
# Runs on a published GitHub Release tagged py/vX.Y.Z, or manually to retry.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions: {}

jobs:
  build:
    name: Build distributions
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'py/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: py

    steps:
      - uses: actions/checkout@v7

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.14"
          enable-cache: true
          working-directory: py

      - name: Install the project
        run: uv sync --locked

      - name: Run tests
        run: uv run pytest -q

      - name: Verify the release tag matches the project version
        if: github.ref_type == 'tag'
        run: |
          version=$(uv run python -c "import tomllib, pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          tag="${GITHUB_REF_NAME#py/v}"
          echo "pyproject: $version / tag: $tag"
          if [ "$version" != "$tag" ]; then
            echo "::error::pyproject.toml version ($version) does not match the release tag ($tag)"
            exit 1
          fi

      - name: Build sdist and wheel
        run: uv build

      - name: Check the metadata renders
        run: uvx twine check --strict dist/*

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: py/dist/
          if-no-files-found: error

  pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/jpcl
    permissions:
      # Mints the OIDC token PyPI trusts
      id-token: write
      contents: read
      # Lets download-artifact fetch the build output
      actions: read

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
